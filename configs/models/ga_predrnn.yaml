data:
  input_length: 24
  output_length: 12
  batch_size: 4
  num_workers: 4

model:
  name: GA_Predrnn
  params:
    input_dim: 4
    hidden_dim: 64
    num_layers: 3
    kernel_size: 5
    output_length: 12
    aux_output_dim: 3
    block_size: 8
    halo_size: 2
    num_heads: 4
    aux_indices: [2, 3, 4]

training:
  epochs: 50
  patience: 10
  lr: 0.001
  # Modern GPUs (Ada/Hopper) run these memory-bound pointwise chains much
  # faster in bf16, which is also numerically safer than fp16 for a GAN.
  # Set use_amp: false to reproduce exact fp32 numerics.
  use_amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  gan:
    enabled: true
    adv_weight: 1.0
    lambda_tec: 1.0
    lambda_aux: 0.1
    g_lr: 0.001
    d_lr: 0.0001
    disc_base_ch: 64
