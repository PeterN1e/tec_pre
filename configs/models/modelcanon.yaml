data:
  input_length: 36
  output_length: 12
  batch_size: 4

model:
  name: ModelCanon
  params:
    d_model: 256
    n_heads: 8
    e_layers: 4
    decoder_layers: 2
    d_ff: 1024
    dropout: 0.05
    patch_size: 4

training:
  epochs: 10
  patience: 10
  lr: 0.0005
  loss_weights:
    delta: 1.0
    recon: 0.3
    fourier: 0.2
    ssim: 0.1
    temporal: 0.05

