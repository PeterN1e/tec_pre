
seed: 42
device: auto
output_dir: save

data:
  data_root: D:/Dataset_tec_NLY
  tec_subdir: tec_ionex_npy/igsg
  indices_subdir: indices
  aux_columns: [kp, ssn, dst, ap, f10.7, ae]
  height: 71
  width: 73
  input_length: 36
  output_length: 12
  batch_size: 4
  num_workers: 0
  pin_memory: true
  window_step: 3  #窗口步长可调
  splits:
    train: [200901, 201612]
    val: [201701, 201812]
    test: [202101, 202412]

#新增 normalize_segments() 函数，支持三种配置格式：
#单月：200901 → [(200901, 200901)]
#连续区间：[200901, 201812] → [(200901, 201812)]
#多片段：[[200501, 200612], [200701, 200812]] → 两段
#每个片段内的帧在全局索引中连续，窗口不会跨越片段间隙

training:
  epochs: 10
  patience: 5
  lr: 0.001
  weight_decay: 0.0
  use_amp: false
  grad_clip: 1.0
  save_best: true
  loss: l1
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 3

model:
  name: GA_Predrnn
  params: {}

